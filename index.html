<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minimax-m3.1-flash-free 骑自行车 · 原生 SVG 2D 动画</title>
<style>
  :root{
    --cycle: .8s;      /* 一次踏频（曲柄转一圈） */
    --spd: 1;          /* 速度倍率 */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:26px 18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:
      radial-gradient(1100px 620px at 50% -10%, #2a3a56 0%, #162030 55%, #0b111b 100%);
    color:#e9eff8;
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:min(980px,96vw)}
  h1{
    margin:0 0 2px; font-size:clamp(17px,2.4vw,22px); font-weight:600; letter-spacing:.3px;
    text-align:center;
  }
  h1 small{display:block; font-size:12px; font-weight:400; color:#8fa3bf; margin-top:6px; letter-spacing:.4px}
  .stage{
    position:relative; border-radius:16px; overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07);
    background:#9fdcf6;
  }
  .stage svg{display:block; width:100%; height:auto}
  .bar{display:flex; gap:9px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:14px}
  button{
    font:inherit; font-size:13px; color:#dce6f4; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    padding:7px 14px; border-radius:9px; transition:.18s;
  }
  button:hover{background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.28)}
  button.on{background:#2b7fff; border-color:#2b7fff; color:#fff; box-shadow:0 4px 16px rgba(43,127,255,.45)}
  .tip{font-size:12px; color:#7f92ad; margin-left:6px}

  /* ===================== 动画定义（关键帧由脚本注入） ===================== */
  /* ---- 旋转（顶层组：角度可正确插值） ---- */
@keyframes kfSpin{
0%{transform:rotate(0deg)}
6.25%{transform:rotate(360deg)}
}
@keyframes kfThigh{

25%{transform:rotate(26.6471deg)}
31.25%{transform:rotate(25.0333deg)}
37.5%{transform:rotate(21.4851deg)}
43.75%{transform:rotate(16.6573deg)}
50%{transform:rotate(10.6977deg)}
56.25%{transform:rotate(3.6968deg)}
62.5%{transform:rotate(-3.911deg)}
68.75%{transform:rotate(-10.9729deg)}
75%{transform:rotate(-15.7588deg)}
81.25%{transform:rotate(-16.9036deg)}
87.5%{transform:rotate(-14.1623deg)}
93.75%{transform:rotate(-8.1925deg)}
}
@keyframes kfTilt{
0%{transform:rotate(-1.4deg)}
6.25%{transform:rotate(0deg)}
12.5%{transform:rotate(1.4deg)}
18.75%{transform:rotate(0deg)}
25%{transform:rotate(-1.4deg)}
}

/* ---- 缩放 / 位移 / 其它 ---- */
@keyframes kfBob{
0%{transform:translateY(0px)}
50%{transform:translateY(-3.4px)}
100%{transform:translateY(0px)}
}

@keyframes kfEye{0%,86%,100%{transform:matrix(1,0,0,1,0,0)}90%{transform:matrix(1,0,0,1,0,0)}93%{transform:matrix(1,0,0,0.08,0,0)}96%{transform:matrix(1,0,0,1,0,0)}}
@keyframes kfPouch{0%,100%{transform:matrix(1,0,0,1,0,0)}50%{transform:matrix(1.035,0,0,0.965,0,0)}}
@keyframes kfSun{0%,100%{transform:matrix(1,0,0,1,0,0)}50%{transform:matrix(1.07,0,0,1.07,0,0)}}
@keyframes kfCloud1{from{transform:translateX(0)}to{transform:translateX(-900px)}}
@keyframes kfCloud2{from{transform:translateX(0)}to{transform:translateX(-900px)}}
@keyframes kfCloud3{from{transform:translateX(0)}to{transform:translateX(-900px)}}
@keyframes kfRoad{from{transform:translateX(0)}to{transform:translateX(-235.62px)}}
@keyframes kfTufts{from{transform:translateX(0)}to{transform:translateX(-235.62px)}}
@keyframes kfTrees{from{transform:translateX(0)}to{transform:translateX(-471.24px)}}
@keyframes kfFence{from{transform:translateX(0)}to{transform:translateX(-235.62px)}}
@keyframes kfChain{from{stroke-dashoffset:0}to{stroke-dashoffset:120}}
@keyframes kfDust{0%{transform:matrix(0.35,0,0,0.35,0,0);opacity:.7}100%{transform:matrix(1.25,0,0,1.25,-30,-16);opacity:0}}
@keyframes kfSpeed{0%%{transform:translateX(0);opacity:.85}100%%{transform:translateX(-38px);opacity:0}}

/* ===================== 动画绑定 ===================== */
.wheel,.crank,.crankFar{
  transform-box:view-box;
  animation:kfSpin calc(var(--cycle)/var(--spd)) linear infinite;
}
.thigh{
  transform-box:view-box;
  animation:kfThigh calc(var(--cycle)/var(--spd)) linear infinite;
}
.shin{
  animation:kfShin calc(var(--cycle)/var(--spd)) linear infinite;
}
.foot{
  animation:kfFoot calc(var(--cycle)/var(--spd)) linear infinite;
}
.pedal{
  animation:kfPedal calc(var(--cycle)/var(--spd)) linear infinite;
}
.legFar .thigh,.legFar .shin,.legFar .foot{
  animation-delay:calc(var(--cycle)/var(--spd) * -0.5);
}
.pelicanBob{animation:kfBob calc(var(--cycle)/var(--spd)/2) ease-in-out infinite}
.pelicanTilt{
  transform-box:view-box;
  animation:kfTilt calc(var(--cycle)/var(--spd)/2) ease-in-out infinite;
}
.eye{animation:kfEye 4.6s ease-in-out infinite}
.pouch{animation:kfPouch 2.6s ease-in-out infinite}
.sun{animation:kfSun 5.4s ease-in-out infinite}
.wingFar{animation:kfWing 1.15s ease-in-out infinite}
.scarf.sc1{animation:kfScarf  calc(var(--cycle)/var(--spd)/2) ease-in-out infinite}
.scarf.sc2{animation:kfScarf2 calc(var(--cycle)/var(--spd)/2) ease-in-out infinite;animation-delay:calc(var(--cycle)/var(--spd)/2 * -.16)}
.scarf.sc3{animation:kfScarf3 calc(var(--cycle)/var(--spd)/2) ease-in-out infinite;animation-delay:calc(var(--cycle)/var(--spd)/2 * -.32)}
.cloud.cl1{animation:kfCloud1 calc(var(--cycle)/var(--spd) * 32.5) linear infinite}
.cloud.cl2{animation:kfCloud2 calc(var(--cycle)/var(--spd) * 42.5) linear infinite}
.cloud.cl3{animation:kfCloud3 calc(var(--cycle)/var(--spd) * 37.5) linear infinite}
.scrollRoad{animation:kfRoad   calc(var(--cycle)/var(--spd) * .625) linear infinite}
.scrollTufts{animation:kfTufts calc(var(--cycle)/var(--spd) * .625) linear infinite}
.scrollTrees{animation:kfTrees calc(var(--cycle)/var(--spd) * 3.125) linear infinite}
.scrollFence{animation:kfFence calc(var(--cycle)/var(--spd) * 2) linear infinite}
.chain{animation:kfChain calc(var(--cycle)/var(--spd)) linear infinite}
.puff{animation:kfDust calc(var(--cycle)/var(--spd) * .625) ease-out infinite}
.puff.p2{animation-delay:calc(var(--cycle)/var(--spd) * .21)}
.puff.p3{animation-delay:calc(var(--cycle)/var(--spd) * .42)}
.sl{animation:kfSpeed calc(var(--cycle)/var(--spd) * .56) linear infinite}
.sl2{animation-delay:calc(var(--cycle)/var(--spd) * .19)}
.sl3{animation-delay:calc(var(--cycle)/var(--spd) * .38)}

/* ===================== 角色名牌 ===================== */
.nameTag text{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none;
}
.nameTag .nt-en,.nameTag .nt-cn{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.nameTag{animation:kfTag calc(var(--cycle)/var(--spd)) ease-in-out infinite}
@keyframes kfTag{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3.5px)}
}

</style>
</head>
<body>
<div class="wrap">
  <h1>🦢 minimax-m3.1-flash-free 骑自行车
    <small>DeepSeek Harness 驱动 · 纯原生 SVG + CSS 动画 · 车轮 / 曲柄 / 踏板 / 地面速度严格同步 · 双腿为二连杆逆运动学解算</small>
  </h1>

  <div class="stage">
  <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" preserveAspectRatio="xMidYMid meet">
    <title id="ttl">minimax-m3.1-flash-free 骑自行车的 2D 动画</title>
    <desc id="dsc">模型 minimax-m3.1-flash-free 化身一只白色鹈鹕骑着青色自行车前进，车轮转动、踏板旋转、地面向后飞驰。</desc>

    <defs>

        <stop offset="0" stop-color="#4fb3ea"/>

        <stop offset="1" stop-color="#e9f9f0"/>
      </linearGradient>
      <radialGradient id="gSun" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff8d6"/>
        <stop offset=".45" stop-color="#ffe27a" stop-opacity=".8"/>

      </radialGradient>
      <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1">

      </linearGradient>
      <linearGradient id="gRoad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#79828f"/><stop offset=".3" stop-color="#5c6471"/><stop offset="1" stop-color="#3d4450"/>

      <linearGradient id="gBody" x1=".25" y1="0" x2=".65" y2="1">

      <g class="sun">

<script>
(function(){
  var root = document.documentElement;
  var toggle = document.getElementById('toggle');
  var playing = true;

  toggle.addEventListener('click', function(){
    playing = !playing;
    document.getAnimations().forEach(function(a){ playing ? a.play() : a.pause(); });
    toggle.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  });

  document.querySelectorAll('[data-spd]').forEach(function(b){
    b.addEventListener('click', function(){
      root.style.setProperty('--spd', b.dataset.spd);
      document.querySelectorAll('[data-spd]').forEach(function(x){ x.classList.toggle('on', x === b); });
    });
  });
})();
</script>
